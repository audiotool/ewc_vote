<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Voting 2026</title>
<style>
  :root{
    --bg:#0c0c0e; --panel:#141417; --panel2:#17171b; --line:#242429;
    --ink:#ececee; --mut:#86868e; --accent:#ff6a13; --accent-dim:rgba(255,106,19,.14);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:40px 18px 120px}
  header{border-bottom:2px solid var(--accent);padding-bottom:22px;margin-bottom:24px}
  .kick{font-size:12px;letter-spacing:4px;color:var(--mut);text-transform:uppercase;font-family:ui-monospace,monospace}
  .logo{height:30px;width:auto;display:block}
  .logo path,.logo rect{fill:var(--ink)}
  h1{font-size:clamp(30px,6vw,46px);letter-spacing:-0.02em;margin:10px 0 0;font-weight:700}
  .lede{color:var(--mut);font-size:14px;line-height:1.6;margin-top:12px;max-width:560px}
  .count{color:var(--accent);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-family:ui-monospace,monospace;margin:0 0 14px}
  #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
  .head{display:flex;align-items:center;gap:10px}
  .num{font-family:ui-monospace,monospace;font-size:13px;color:var(--accent);min-width:22px}
  .ttl{flex:1;min-width:0;font-size:16px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player{display:flex;align-items:center;gap:10px;margin-top:10px}
  .pbtn{width:38px;height:38px;min-width:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);
    color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:.12s;padding:0}
  .pbtn:hover{border-color:var(--accent)}
  .pbtn.on{background:var(--accent);border-color:var(--accent);color:#111}
  .row{transition:border-color .15s}
  .row:hover{border-color:#3a3a42}
  .row.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .pbar{position:relative;flex:1;height:6px;border-radius:4px;background:#202027;cursor:pointer;overflow:hidden}
  .pbar .buf{position:absolute;inset:0 auto 0 0;width:0;background:#30303a}
  .pbar .played{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
  .time{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);min-width:78px;text-align:right}
  .dl{display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap;
    font-size:12px;font-weight:600;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;transition:.12s}
  .dl:hover{border-color:var(--accent);background:var(--accent-dim);color:#fff}
  .dl.off{opacity:.38;cursor:default;pointer-events:none}
  .dl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  .count{display:flex;align-items:center;gap:14px}
  .reset{background:none;border:0;padding:0;color:var(--mut);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .reset:hover{color:var(--ink)}
  .heard{display:none;align-items:center;gap:4px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;color:var(--accent);white-space:nowrap}
  .row.done .heard{display:inline-flex}
  .row.done{background:#111114}
  .row.done .ttl{color:var(--mut)}
  .row.done.on .ttl{color:var(--ink)}
  .statusbar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,12,0.92);border-top:1px solid var(--line);
    backdrop-filter:blur(8px);padding:9px 18px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0));
    display:flex;justify-content:space-between;font-size:11px;color:var(--mut);letter-spacing:1px;font-family:ui-monospace,monospace}
  .statusbar b{color:var(--accent)}
  .vbtns{display:none;gap:4px}
  body.voting .vbtns{display:flex}
  body.voting .heard{display:none!important}
  .vb{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);
    font-family:ui-monospace,monospace;font-size:12px;font-weight:700;cursor:pointer;padding:0;transition:.12s}
  .vb:hover{border-color:var(--accent);color:var(--ink)}
  .vb.sel{background:var(--accent);border-color:var(--accent);color:#111}
  .who{display:none;color:var(--accent);font-weight:500}
  body.voting .who{display:inline}
  .out{display:none;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;color:var(--mut);white-space:nowrap}
  body.voting .row.x .vbtns{display:none}
  body.voting .row.x .out{display:inline}
  body.voting .row.x{opacity:.4}
  body.voting .row.pick{border-color:var(--accent)}
  .vpanel{display:none;position:fixed;left:0;right:0;bottom:37px;z-index:5;background:#16120f;border-top:2px solid var(--accent);
    padding:12px 18px;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}
  body.voting .vpanel{display:flex}
  body.voting .wrap{padding-bottom:200px}
  .vtag{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:700}
  .vname{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:8px 10px;font:inherit;width:160px}
  .vname:focus{outline:none;border-color:var(--accent)}
  .vslot{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);white-space:nowrap}
  .vslot b{color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}
  .vsend{margin-left:auto;background:var(--accent);color:#111;border:0;border-radius:7px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
  .vsend:disabled{opacity:.35;cursor:default}
  .vclose{background:none;border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:8px 11px;font:inherit;cursor:pointer}
  .vclose:hover{color:var(--ink);border-color:#3a3a42}
  .vmsg{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:1px;color:var(--accent)}
  @media(max-width:760px){ #list{grid-template-columns:1fr} }
</style>
</head>

  var cnt=document.getElementById('count');
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(HEARD)); }catch(e){} }
  function updCount(){ var n=0; TRACKS.forEach(function(t){ if(HEARD[t.f])n++; }); cnt.textContent=n+' / '+TRACKS.length+' heard'; }
  document.getElementById('reset').addEventListener('click',function(){ HEARD={}; save(); document.querySelectorAll('.row.done').forEach(function(r){ r.classList.remove('done'); }); updCount(); });
  function fmt(s){ if(!isFinite(s)||s<0)s=0; s=s|0; return (s/60|0)+':'+('0'+(s%60)).slice(-2); }
  function pauseOthers(cur){ ALL.forEach(function(a){ if(a!==cur&&!a.paused)a.pause(); }); }

  TRACKS.forEach(function(t,i){
    var url=drive(t.d);
    var row=document.createElement('div'); row.className='row';
    var num=document.createElement('div'); num.className='num'; num.textContent=String(i+1).padStart(2,'0');
    var head=document.createElement('div'); head.className='head';
    var ttl=document.createElement('div'); ttl.className='ttl'; ttl.textContent=t.t;
    var who=document.createElement('span'); who.className='who'; who.textContent=' \u00b7 '+(t.a==='rai_'?'rai.':t.a); ttl.appendChild(who);
    var hd=document.createElement('span'); hd.className='heard'; hd.textContent='\u2713 HEARD';
    if(HEARD[t.f]) row.classList.add('done');
    var pl=document.createElement('div'); pl.className='player';
    var btn=document.createElement('button'); btn.className='pbtn'; btn.type='button'; btn.textContent='\u25B6';
    var bar=document.createElement('div'); bar.className='pbar';
    var buf=document.createElement('div'); buf.className='buf';
    var pd=document.createElement('div'); pd.className='played';
    bar.appendChild(buf); bar.appendChild(pd);
    var tm=document.createElement('div'); tm.className='time'; tm.textContent='0:00';
    var au=document.createElement('audio'); au.preload='none'; au.src=encodeURIComponent(t.f)+'.mp3'; ALL.push(au);
    pl.appendChild(btn); pl.appendChild(bar); pl.appendChild(tm);
    var dl;
    if(url){ dl=document.createElement('a'); dl.className='dl'; dl.href=url; dl.setAttribute('download',''); }
    else { dl=document.createElement('span'); dl.className='dl off'; dl.title='Download kommt'; }
    dl.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg> WAV';
    var vb=document.createElement('div'); vb.className='vbtns';
    var out=document.createElement('span'); out.className='out'; out.textContent='NOT ELIGIBLE';
    if(EXCLUDED.indexOf(t.a)>-1) row.classList.add('x');
    [0,1,2].forEach(function(k){ var b=document.createElement('button'); b.type='button'; b.className='vb'; b.textContent=String(k+1); b.title='Platz '+(k+1);
      b.addEventListener('click',function(){ pick(k,i); }); vb.appendChild(b); });
    ROWS.push({row:row,btns:vb.children});
    head.appendChild(num); head.appendChild(ttl); head.appendChild(hd); head.appendChild(out); head.appendChild(vb); head.appendChild(dl);
    row.appendChild(head); row.appendChild(pl); row.appendChild(au);
    list.appendChild(row);
    function upd(){ var d=au.duration; tm.textContent=fmt(au.currentTime)+((isFinite(d)&&d>0)?(' / '+fmt(d)):''); }
    btn.addEventListener('click',function(){ if(!HEARD[t.f]){ HEARD[t.f]=1; save(); row.classList.add('done'); updCount(); } if(au.paused){ pauseOthers(au); au.play().catch(function(){}); btn.textContent='...'; } else au.pause(); });
    au.addEventListener('play',function(){ btn.textContent='\u2759\u2759'; btn.classList.add('on'); row.classList.add('on'); });
    au.addEventListener('pause',function(){ btn.textContent='\u25B6'; btn.classList.remove('on'); row.classList.remove('on'); });
    au.addEventListener('ended',function(){ btn.textContent='\u25B6'; pd.style.width='0%'; });
    au.addEventListener('timeupdate',function(){ var d=au.duration||0; pd.style.width=(d?au.currentTime/d*100:0)+'%'; upd(); });
    au.addEventListener('loadedmetadata',upd);
    au.addEventListener('progress',function(){ try{ if(au.buffered.length){ var e=au.buffered.end(au.buffered.length-1),d=au.duration||0; buf.style.width=(d?e/d*100:0)+'%'; } }catch(e){} });
    au.addEventListener('error',function(){ btn.textContent='!'; });
    bar.addEventListener('click',function(e){ var r=bar.getBoundingClientRect(),d=au.duration||0; if(d) au.currentTime=Math.max(0,Math.min(d,(e.clientX-r.left)/r.width*d)); });
  });
  updCount();

  /* ===== VOTING ===== */
  var vname=document.getElementById('vname'), vsend=document.getElementById('vsend'), vmsg=document.getElementById('vmsg');
  try{ vname.value=localStorage.getItem('ewc26_vote_name')||''; }catch(e){}
  function pick(k,i){
    if(PICKS[k]===i) PICKS[k]=null;
    else { PICKS=PICKS.map(function(p){ return p===i?null:p; }); PICKS[k]=i; }
    vmsg.textContent=''; render();
  }
  function render(){
    ROWS.forEach(function(r,i){
      var on=false;
      for(var k=0;k<3;k++){ var s=PICKS[k]===i; r.btns[k].classList.toggle('sel',s); if(s)on=true; }
      r.row.classList.toggle('pick',on);
    });
    for(var k=0;k<3;k++) document.getElementById('vs'+k).textContent=PICKS[k]===null?'?':TRACKS[PICKS[k]].t;
    vsend.disabled=!(vname.value.trim() && PICKS.every(function(p){ return p!==null; }));
  }
  vname.addEventListener('input',function(){ try{ localStorage.setItem('ewc26_vote_name',vname.value.trim()); }catch(e){} render(); });
  vsend.addEventListener('click',function(){
    if(!SCRIPT_URL){ vmsg.textContent='SCRIPT URL FEHLT'; return; }
    var body={name:vname.value.trim(), p1:TRACKS[PICKS[0]].t+' ('+TRACKS[PICKS[0]].f+')', p2:TRACKS[PICKS[1]].t+' ('+TRACKS[PICKS[1]].f+')', p3:TRACKS[PICKS[2]].t+' ('+TRACKS[PICKS[2]].f+')'};
    vsend.disabled=true; vmsg.textContent='SENDE...';
    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
      .then(function(){ vmsg.textContent='\u2713 GESENDET'; render(); })
      .catch(function(){ vmsg.textContent='FEHLER, NOCHMAL VERSUCHEN'; render(); });
  });
  render();
})();
</script>
</body>
</html>
